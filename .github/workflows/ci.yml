name: OpsPilot validation
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opspilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d opspilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/opspilot_test
      COOKIE_SECURE: "false"
      AI_ENABLED: "false"
      BILLING_PROVIDER: test
      BILLING_WEBHOOK_SECRET: test-webhook-secret-0123456789
      MAIL_TRANSPORT: console
      APP_URL: http://localhost:3000
      JOBS_TICK_SECRET: jobs-tick-secret-0123456789
      TEST_BASE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx opspilot/scripts/migrate.ts
      - run: npm run lint
      - run: npx next typegen
      - run: npm exec tsc -- --noEmit --pretty false
      - run: npm run build
      - run: npx tsx --test opspilot/tests/domain.test.ts opspilot/tests/migrations.test.ts opspilot/tests/hardening.test.ts
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - name: Start production test server
        run: |
          npm run start > /tmp/opspilot-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/opspilot-server.log
          exit 1
      - run: npx tsx --test opspilot/tests/api.test.ts
      - run: npx tsx --test opspilot/tests/billing.test.ts
      - run: npx tsx --test opspilot/tests/email.test.ts
      - name: Jobs and queue suite
        run: |
          set -o pipefail
          status=0
          npx tsx --test opspilot/tests/jobs.test.ts 2>&1 | tee /tmp/jobs.log || status=$?
          if [ $status -ne 0 ]; then
            # Surface the failing assertion as a check annotation: logs are not
            # always reachable from outside, annotations always are.
            detail=$(grep -E "not ok|AssertionError|expected:|actual:|Error:" /tmp/jobs.log | head -12 | tr '\n' ' ')
            echo "::error title=jobs.test.ts failed::${detail:0:900}"
            exit $status
          fi
      - run: npx playwright test --config=opspilot/tests/playwright.config.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: opspilot-test-artifacts
          path: opspilot/tests/artifacts
